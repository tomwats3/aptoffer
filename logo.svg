<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AptOffer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5"/><stop offset="1" stop-color="#1c5cab"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141413"/>
  <!-- taller tower -->
  <rect x="12" y="16" width="20" height="34" rx="2" fill="url(#sky)"/>
  <!-- shorter tower -->
  <rect x="34" y="26" width="18" height="24" rx="2" fill="#3987e5" opacity=".72"/>
  <!-- ground line -->
  <rect x="9" y="50" width="46" height="2.5" rx="1.25" fill="#c3c2b7" opacity=".5"/>
  <!-- windows, left tower -->
  <g fill="#141413" opacity=".85">
    <rect x="16" y="21" width="4" height="4" rx="1"/><rect x="23" y="21" width="4" height="4" rx="1"/>
    <rect x="16" y="28" width="4" height="4" rx="1"/><rect x="23" y="28" width="4" height="4" rx="1"/>
    <rect x="16" y="35" width="4" height="4" rx="1"/><rect x="23" y="35" width="4" height="4" rx="1"/>
    <rect x="16" y="42" width="4" height="4" rx="1"/>
  </g>
  <!-- lit unit: the "offer" -->
  <rect x="23" y="42" width="4" height="4" rx="1" fill="#eda100"/>
  <!-- windows, right tower -->
  <g fill="#141413" opacity=".8">
    <rect x="38" y="31" width="3.5" height="3.5" rx="1"/><rect x="44.5" y="31" width="3.5" height="3.5" rx="1"/>
    <rect x="38" y="38" width="3.5" height="3.5" rx="1"/><rect x="44.5" y="38" width="3.5" height="3.5" rx="1"/>
    <rect x="38" y="44" width="3.5" height="3.5" rx="1"/><rect x="44.5" y="44" width="3.5" height="3.5" rx="1"/>
  </g>
</svg>
